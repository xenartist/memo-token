[package]
name = "home_web_test"
version = "0.1.0"
edition = "2021"
description = "Throwaway prototype for the home:// browser extension: MEMO ID names and Asset files (local validator only, never deployed)"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = "0.32.1"
solana-sha256-hasher = "2.3.0"  # SHA-256 via the sol_sha256 syscall on-chain

[profile.release]
overflow-checks = true

# Standalone workspace, built by scripts/run-regression-tests.sh with cargo build-sbf
[workspace]
