[package]
name = "memo-burn"
version = "0.2.0"
description = "Simplified memo burn contract"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "memo_burn"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []
mainnet = []

[dependencies]
anchor-lang = "0.32.1"
anchor-spl = "0.32.1"
spl-memo = "6.0"
base64 = "0.22"

[dev-dependencies]
# Runtime serializer for the instructions sysvar, used to test check_memo_instruction
solana-instructions-sysvar = "2.2.2"
solana-instruction = "2.3.0"
