[package]
name = "memo-home"
version = "0.1.0"
description = "MEMO Home Contract - Metaplex Core collections and assets with a protected Vault per asset"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "memo_home"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []
mainnet = ["memo-burn/mainnet", "memo-mint/mainnet"]

[dependencies]
anchor-lang = "0.32.1"
anchor-spl = "0.32.1"
memo-burn = { path = "../memo-burn", features = ["cpi"] }
memo-mint = { path = "../memo-mint", features = ["cpi"] }
