[package]
name = "memo-id"
version = "0.1.0"
description = "MEMO ID Contract - unique IDs such as xen-artist.memo, owned as memo-home NFTs"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "memo_id"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []
mainnet = ["memo-home/mainnet", "memo-burn/mainnet", "memo-mint/mainnet"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = "0.32.1"
spl-memo = "6.0"
base64 = "0.22"
solana-sha256-hasher = "2.3.0"  # SHA-256 via the sol_sha256 syscall on-chain
memo-burn = { path = "../memo-burn", features = ["cpi"] }
memo-mint = { path = "../memo-mint", features = ["cpi"] }
memo-home = { path = "../memo-home", features = ["cpi"] }
