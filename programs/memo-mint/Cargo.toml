[package]
name = "memo-mint"
version = "0.3.0"
description = "Simplified memo mint contract"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "memo_mint"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []
mainnet = []

[dependencies]
anchor-lang = "0.32.1"
anchor-spl = "0.32.1"
spl-memo = "6.0"
solana-sha256-hasher = "2.3.0"  # SHA-256 via the sol_sha256 syscall on-chain

[dev-dependencies]
# Runtime serializer for the instructions sysvar, used to test the transaction fingerprint
solana-instructions-sysvar = "2.2.2"
solana-instruction = "2.3.0"
